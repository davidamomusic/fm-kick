# FM-KICK's build settings (tools/build.py)
name = "FM-KICK"
id_prefix = "FM-1_22"            # plain dev builds only
usb_manufacturer = "FM-KICK"
usb_product = "FM-KICK FM-1"
o2 = ["dsp.c", "fx.c"]
mirror = true                    # the screen and panel mirrored over USB: kick/docs/FM-KICK-mirror.html
emu = ["midi"]                   # the browser player: a MIDI keyboard or a DAW can play it
ble = false
words = "words.tsv"
tagline = "a kick drum synthesizer and generative sequencer for the FM-1"
licence = "MPL-2.0"
author = "David Amo"
description = "A kick drum synthesizer with six kinds of kick and 48 parameters, a sequencer of up to 32 steps with p-locks of any parameter, nine generators, four LFOs, live and final effects, themes and 32 user kicks."
tags = ["drum-machine", "generative"]
