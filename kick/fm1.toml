# FM-KICK's build settings (tools/build.py)
name = "FM-KICK"
id_prefix = "FM-1_22"            # plain dev builds only
usb_manufacturer = "FM-KICK"
usb_product = "FM-KICK FM-1"
o2 = ["dsp.c", "fx.c"]
mirror = true                    # the screen and panel mirrored over USB: kick/docs/FM-KICK-mirror.html
emu = ["midi"]                   # the browser player: a MIDI keyboard or a DAW can play it
ble = false
headphones = true
cpu2 = true                      # the second core: REVERB's hall runs there (fx_begin)
cpu2_fallback = true
backup = true                    # backup and restore over USB: the mirror page's Projects and backup, Render Audio
backup_ext = "fmkbak"
backup_holds = "your patterns, user kicks, settings and projects"             # a unit that cannot run it: one core until power-off, no restart                # the jack read: AUDIO turns the speaker and the headphones on and off apart
words = "words.tsv"
tagline = "a kick drum synthesizer and generative sequencer for the FM-1"
licence = "MPL-2.0"
author = "David Amo"
description = "A kick drum synthesizer with seven kinds of kick and 48 parameters, a sequencer of up to 32 steps with p-locks of any parameter, nine generators, four LFOs, live and final effects, themes and 32 user kicks."
tags = ["drum-machine", "generative"]
